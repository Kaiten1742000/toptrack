name: Spotify-Daten aktualisieren

on:
  schedule:
    - cron: "17 3 * * 1"   # jeden Montag um 03:17 UTC
  workflow_dispatch:        # manuell über "Run workflow" startbar

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Daten von kworb.net sammeln
        run: node scripts/build-data.mjs

      - name: Neue Daten speichern
        run: |
          git config user.name "toptrack-bot"
          git config user.email "toptrack-bot@users.noreply.github.com"
          git add toptrack-daten.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Spotify-Daten aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
